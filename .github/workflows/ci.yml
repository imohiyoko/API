name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go.mod は利用者に求める最小の版（1.26）。CI は標準ライブラリの脆弱性の修正が入った最新の安定版で動かす。
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated files are up to date
        run: |
          go run ./examples/users/cmd/users gen -out examples/users/api -title Users
          git diff --exit-code
          test -z "$(git status --porcelain examples/users/api)"
      - name: gRPC E2E (grpcurl with the generated .proto)
        run: scripts/e2e-grpc.sh
      - name: iam E2E (service account tokens, scopes and resources against a real iam)
        run: scripts/e2e-iam.sh
      - name: sidecar E2E (Node.js upstream with the YAML manifest matches the Go library)
        run: scripts/e2e-sidecar.sh
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
