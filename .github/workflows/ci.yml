name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod は利用者に求める最小の版（1.24）。CI は標準ライブラリの脆弱性の修正が入った最新の安定版で動かす。
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated files are up to date
        run: |
          go run ./examples/users/cmd/users gen -out examples/users/api -title Users
          git diff --exit-code
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
